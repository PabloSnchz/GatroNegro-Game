<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LWPE — Lemmings Web Preservation Engine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #dropzone {
      padding: 8px 16px; background: #1c1c1c; border-bottom: 1px solid #333;
      font-size: 13px; display: flex; gap: 16px; align-items: center;
    }
    #dropzone.dragover { background: #2a3a2a; }
    #canvas-host { flex: 1; overflow: hidden; position: relative; }
  </style>
</head>
<body>
  <div id="app">
    <div id="dropzone">
      <strong>LWPE</strong>
      <span id="status">Cargando…</span>
      <span style="color:#666">|</span>
      <span style="color:#888">Arrastra aquí .DAT / .LVL originales (opcional)</span>
    </div>
    <div id="canvas-host"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
